name: CI

on:
  push:
    branches: [ master, 'feature/**' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    
    runs-on: windows-latest

    steps:  
    - name: Configure Git for long paths
      run: git config --global core.longpaths true

    - uses: actions/checkout@v6
      with:
        submodules: 'recursive'

    - name: Cache
      uses: actions/cache@v5
      with:
        path: Build/WinMergeDownloadDeps
        key: WinMergeDownloadDeps

    - name: Build
      run: |
        .\DownloadDeps.cmd
        .\BuildBin.cmd x64 -ci
        .\BuildTranslations.cmd
        .\BuildArc.cmd x64 -ci
        dir Build\Releases

    - name: Upload portable zip package
      uses: actions/upload-artifact@v4
      with:
        name: WinMerge-x64-Portable
        path: Build/Releases/*.zip

    - name: Upload WinMerge x64 binaries
      uses: actions/upload-artifact@v4
      with:
        name: WinMerge-x64-Binaries
        path: |
          Build/x64/Release/WinMergeU.exe
          Build/x64/Release/*.dll
          Build/x64/Release/WinIMerge/
          Build/x64/Release/WinWebDiff/
          Build/x64/Release/darkmodelib/
          Build/x64/Release/TreeSitterGrammars/
          Build/x64/Release/Merge7z/
